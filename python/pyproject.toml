[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garageworks"
version = "0.2.0"
requires-python = ">=3.9"
dependencies = [
    "cocotb==1.9.2",
    "cocotb-bus==0.3.0",
    "cocotb-test==0.2.6",
    "cocotbext-axi==0.1.26",
    "libcst==1.8.6",
    "pytest==8.4.2",
]

[project.optional-dependencies]
gwcd = ["anthropic", "openai"]

[tool.setuptools.packages.find]
where = ["."]
include = ["garageworks*"]

[tool.setuptools.package-data]
"garageworks.gwscript" = ["templates/*", "gwcdskills/*"]

[project.scripts]
gwscript = "garageworks.gwscript:main"
gws = "garageworks.gwscript:main"
conv_cocotb_to_fpga = "garageworks.bridge.conv_cocotb_to_fpga:main"
